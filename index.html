<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/icon-512.png?v=2" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%profile.site.title%</title>
    <meta name="description" content="%profile.site.description%" />

    <!-- OG Tags -->
    <meta property="og:title" content="%profile.site.title%" />
    <meta property="og:description" content="%profile.site.description%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%profile.site.url%" />
    <meta property="og:image" content="%profile.site.ogImage%" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%profile.site.title%" />
    <meta name="twitter:description" content="%profile.site.twitterDescription%" />

    <!-- SEO Meta -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="%profile.person.name%" />
    <meta name="theme-color" content="%profile.site.themeColor%" />

    <!-- Canonical -->
    <link rel="canonical" href="%profile.site.url%" />

    <!-- Google Fonts — Preconnect + Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Apply saved / system theme before first paint (no flash) -->
    <script>
      try {
        var t = localStorage.getItem('theme-preference');
        if (t === 'dark' || (t === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- JSON-LD Person Schema -->
    <script type="application/ld+json">
    %JSON_LD%
    </script>
  </body>
</html>
